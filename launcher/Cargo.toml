[package]
name = "lugha-desk-launcher"
version = "0.3.4-preview"
edition = "2021"
publish = false

[dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_Security_Cryptography", "Win32_Networking_WinHttp", "Win32_System_LibraryLoader", "Win32_Storage_Compression", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = "s"
strip = true
