name: Microsoft Store unsigned package

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.9'
      - name: Run Store staging and actual-package integrity regressions
        run: |
          python tests/test_stage_bundle.py
          if ($LASTEXITCODE -ne 0) { throw 'Runtime staging tests failed' }
          python tests/test_stage_store.py
          if ($LASTEXITCODE -ne 0) { throw 'Store staging tests failed' }
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust setup failed' }
      - name: Build and validate complete offline Store package
        run: ./scripts/build-store.ps1
      - name: Upload dependency diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Lugha-Store-diagnostics-${{ github.sha }}
          path: target/store-diagnostics/*.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload unsigned Store review package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Lugha-Desk-STORE-REVIEW-${{ github.sha }}
          path: dist/store/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
